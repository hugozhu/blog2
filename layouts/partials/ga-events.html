{{- /* Site-action tracking to Google Analytics (via gtag). Fires on clicks and scroll-to-bottom. */ -}}
<script>
(function () {
  // Send a GA4 event through gtag; degrade gracefully if gtag isn't loaded yet.
  // GA4 auto-captures the page (page_path), so we only pass the action dimension.
  function sendEvent(action) {
    if (typeof gtag === 'function') {
      gtag('event', 'site_action', { action: action });
    } else {
      // Fallback to a raw data-layer push if gtag is unavailable.
      var dl = window.dataLayer = window.dataLayer || [];
      dl.push({ event: 'site_action', action: action });
    }
  }

  // Normalize the path a link would navigate to (strips hash/query, absolutizes).
  function navPath(href) {
    if (!href) return '';
    var path = href.split('#')[0].split('?')[0];
    if (path.indexOf('/') === 0) return path;
    try { return new URL(href, window.location.href).pathname; }
    catch (e) { return path; }
  }

  var firedBottom = false;
  document.addEventListener('DOMContentLoaded', function () {

    // --- Click events: search, notes, tags, about (delegated) ---
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!(t && t.nodeType === 1)) return;

      // 1. Search trigger — DocSearch mount point (#docsearch), including child clicks.
      if (t.closest('#docsearch')) {
        sendEvent('search_click');
      }

      // 2. Navigation & in-content links by href.
      var a = t.closest('a[href]');
      if (a) {
        var p = navPath(a.getAttribute('href'));

        if (p === '/notes' || p.indexOf('/notes/') === 0) {
          sendEvent('notes_click');
        } else if (p === '/tags' || p.indexOf('/tags/') === 0) {
          sendEvent('tags_click');
        } else if (p === '/page/about/' || p.indexOf('/page/about') === 0) {
          sendEvent('about_click');
        }
      }
    }, true);

    // --- Scroll-to-bottom — fire once, only after the user actually scrolls. ---
    var ticking = false;
    function onScroll() {
      if (firedBottom || ticking) return;
      // Remove once a real scroll has occurred; keeps short pages from firing on load.
      window.removeEventListener('scroll', onScroll);
      ticking = true;
      window.requestAnimationFrame(function () {
        ticking = false;
        var doc = document.documentElement;
        var nearBottom = doc.scrollHeight - (window.scrollY + window.innerHeight) < 200;
        if (nearBottom) {
          firedBottom = true;
          sendEvent('scroll_to_bottom');
        }
      });
    }
    window.addEventListener('scroll', onScroll, { passive: true });
  });
})();
</script>
