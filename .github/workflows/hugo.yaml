# Sample workflow for building and deploying a Hugo site to GitHub Pages
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Notify workflow started
  notify-start:
    runs-on: ubuntu-latest
    steps:
      - name: DingTalk Notification
        uses: hugozhu/dingtalk-github-action@v1
        with:
          token: ${{ secrets.DINGTALK_TOKEN }}
          title: "hugozhu.site deploy started"
          type: text
          content: |
            > ${{ github.event.head_commit.message }}
            > Deploy workflow triggered by ${{ github.actor }}.

  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.161.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          submodules: recursive
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Shanghai
        run: |
          rm -rf public
          git clone --depth=1 https://github.com/hugozhu/hugozhu.github.com public
          hugo \
            --gc \
            --minify
      - name: Build static search index
        run: |
          # Prefer Permalinks from Hugo index.json; write into public/search for Pages
          mkdir -p public/js/search
          # Keep client sources from static/ (already copied by hugo)
          node scripts/build-search-index.mjs \
            --from-index public/index.json \
            --out public/search \
            --meta-out public/js/search/build-meta.js
      - name: Deploy to Github Pages
        run: |
          cd public
          git status
          git config --global user.name "Hugo Zhu"
          git config --global user.email "hugozhu@gmail.com"
          git remote set-url origin https://x-access-token:${{ secrets.TOKEN }}@github.com/hugozhu/hugozhu.github.com
          git add *
          git commit -m "Updated ${{ env.GITHUB_RUN_ID }}" .
          git push origin main

  notify:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    steps:
      - name: Get failed step name
        if: needs.build.result != 'success'
        id: failed_step
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          failed=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs \
            --jq '.jobs[] | select(.name=="build") | .steps[] | select(.conclusion=="failure") | .name' | head -1)
          echo "name=${failed:-unknown}" >> "$GITHUB_OUTPUT"
      - name: DingTalk Notification
        uses: hugozhu/dingtalk-github-action@v1
        with:
          token: ${{ secrets.DINGTALK_TOKEN }}
          title: "${{ needs.build.result == 'success' && '✅' || '❌' }} hugozhu.site deploy ${{ needs.build.result }}"
          type: text
          content: |
            > ${{ github.event.head_commit.message }}
            > Status: **${{ needs.build.result }}**
            ${{ needs.build.result != 'success' && format('> Failed step: **{0}**', steps.failed_step.outputs.name) || '' }}
            > Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
