# Build the Hugo blog + ai-notepad (/notes) and deploy to Tencent EdgeOne Pages.
# Independent of hugo.yaml (GitHub Pages); disable this workflow from the Actions tab to stop it.
#
# Required repo settings:
#   vars.EDGEONE_PROJECT        EdgeOne Pages project name (workflow is skipped when unset)
#                               Area is "overseas" = Global (MLC excluded), no ICP filing needed.
#                               Area is fixed at project creation; "global" would include mainland China.
#   secrets.EDGEONE_API_TOKEN   EdgeOne Pages API token
#   secrets.NOTEPAD_READ_TOKEN  fine-grained PAT, repo hugozhu/ai-notepad only, Contents: read
#
# blog2 is PUBLIC and ai-notepad is PRIVATE: never print ai-notepad sources, never upload
# artifacts, and never add pull_request / pull_request_target triggers to this workflow.
name: Deploy to Tencent EdgeOne Pages

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [notepad-updated]
  workflow_dispatch:
    inputs:
      project:
        description: EdgeOne project name (empty = vars.EDGEONE_PROJECT, i.e. production)
        type: string
        default: ''
      with_functions:
        description: Deploy edge-functions/ too (default). Uncheck for an emergency static-only deploy (functions will be gone).
        type: boolean
        default: true
      environment:
        description: EdgeOne environment (preview is isolated from production)
        type: choice
        options: [production, preview]
        default: production

permissions:
  contents: read

concurrency:
  group: tencent-edgeone
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  deploy:
    if: vars.EDGEONE_PROJECT != ''
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.161.1
      PROJECT: ${{ inputs.project || vars.EDGEONE_PROJECT }}
      # push / repository_dispatch have no inputs -> deploy with functions.
      # Every EdgeOne deployment is a full snapshot, so a static-only deploy removes the functions.
      WITH_FUNCTIONS: ${{ github.event_name != 'workflow_dispatch' || inputs.with_functions }}
      EO_ENV: ${{ inputs.environment || 'production' }}
      IS_PRODUCTION: ${{ (inputs.project || vars.EDGEONE_PROJECT) == vars.EDGEONE_PROJECT && (inputs.environment || 'production') == 'production' }}
      SITE_URL: https://hugozhu.site/
    steps:
      - name: Install Hugo CLI
        run: |
          wget -q -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb

      - name: Checkout blog2
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN }}
          submodules: recursive
          # Shallow clone (also applies to the theme submodule): a full clone of
          # beautifulhugo took ~85s. Build does not need history (enableGitInfo is off).
          fetch-depth: 1

      - name: Checkout ai-notepad (private)
        uses: actions/checkout@v4
        with:
          repository: hugozhu/ai-notepad
          token: ${{ secrets.NOTEPAD_READ_TOKEN }}
          path: .ai-notepad
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build blog with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          TZ: Asia/Shanghai
        run: |
          rm -rf public
          hugo --gc --minify
          rm -f public/CNAME
          mkdir -p public/js/search
          node scripts/build-search-index.mjs \
            --from-index public/index.json \
            --out public/search \
            --meta-out public/js/search/build-meta.js

      - name: Build ai-notepad into /notes
        # Mirrors the COPY lines of ai-notepad's Dockerfile; only public static files are copied.
        run: |
          (cd .ai-notepad && node scripts/build-skill-docs.js > /dev/null)
          dest=public/notes
          mkdir -p "$dest/js"
          cp .ai-notepad/{index.html,manifest.json,sw.js,styles.css} "$dest/"
          cp -r .ai-notepad/js/. "$dest/js/"
          rm -f "$dest/js/config.local.js"
          # Skill docs + CLI live at the site root, as in the original Dockerfile:
          #   /skills/ai-notepad/ (index.html), /skills/ai-notepad/SKILL.md, /skills/ai-notepad/cli
          mkdir -p public/skills/ai-notepad public/.well-known
          cp .ai-notepad/skills/ai-notepad/{index.html,SKILL.md,cli} public/skills/ai-notepad/
          cat > public/.well-known/agent-skills.json <<'EOF'
          {"skills":[{"name":"ai-notepad","url":"https://hugozhu.site/skills/ai-notepad/SKILL.md","cli_url":"https://hugozhu.site/skills/ai-notepad/cli","docs":"https://hugozhu.site/skills/ai-notepad/","description":"Manage Hugo's Notebook notes from terminal"}],"format":"https://hugozhu.site/skills/{name}/SKILL.md"}
          EOF
          rm -rf .ai-notepad
          echo "notes files: $(find "$dest" -type f | wc -l)"

      - name: Add EdgeOne config
        run: cp edgeone/edgeone.json public/edgeone.json

      # ---- Default: static upload only (safe, takes effect immediately) ----
      - name: Deploy to EdgeOne Pages (static)
        if: env.WITH_FUNCTIONS != 'true'
        run: npx --yes edgeone@latest pages deploy public -n "$PROJECT" -a overseas -e "$EO_ENV" -t "${{ secrets.EDGEONE_API_TOKEN }}"

      # ---- Optional: static + edge-functions bundle ----
      # `deploy <dir>` ignores edge-functions/, so build .edgeone/ first and deploy that.
      # The CLI names the zip root after the CURRENT DIRECTORY, so the staging dir must NOT
      # start with a dot (".eo-deploy" produced an empty site: 404 "The site does not exist").
      - name: Build EdgeOne bundle (static + edge functions)
        if: env.WITH_FUNCTIONS == 'true'
        run: |
          mkdir -p eo-deploy
          cp -r public eo-deploy/dist
          rm -f eo-deploy/dist/edgeone.json
          cp -r edge-functions eo-deploy/
          cd eo-deploy
          jq '. + {outputDirectory: "./dist", installCommand: "", buildCommand: ""}' ../edgeone/edgeone.json > edgeone.json
          npx --yes edgeone@latest pages build
          cp ../edgeone/edgeone.json edgeone.json
          test -f .edgeone/edge-functions/index.js
          echo "assets: $(find .edgeone/assets -type f | wc -l) files"

      - name: Deploy to EdgeOne Pages (with functions)
        if: env.WITH_FUNCTIONS == 'true'
        working-directory: eo-deploy
        run: npx --yes edgeone@latest pages deploy .edgeone -n "$PROJECT" -a overseas -e "$EO_ENV" -t "${{ secrets.EDGEONE_API_TOKEN }}"

      - name: Guard production homepage (auto-rollback to static on failure)
        if: env.WITH_FUNCTIONS == 'true' && env.IS_PRODUCTION == 'true'
        run: |
          # 4 checks x 15s (~1 min); was 12 x 15s = 3 min even when healthy.
          for i in $(seq 1 4); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 "$SITE_URL" || true)
            echo "check $i: $code"
            if [ "$code" != 200 ]; then
              echo "::error::Homepage returned $code after function deploy; rolling back to static upload"
              npx --yes edgeone@latest pages deploy public -n "$PROJECT" -a overseas -t "${{ secrets.EDGEONE_API_TOKEN }}"
              exit 1
            fi
            sleep 15
          done

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.result != 'skipped'
    steps:
      - name: DingTalk Notification
        uses: hugozhu/dingtalk-github-action@v1
        with:
          token: ${{ secrets.DINGTALK_TOKEN }}
          title: "${{ needs.deploy.result == 'success' && '✅' || '❌' }} EdgeOne deploy ${{ needs.deploy.result }}"
          type: text
          content: |
            > Tencent EdgeOne Pages: **${{ needs.deploy.result }}** (${{ github.event_name }})
            > ${{ github.event.head_commit.message || github.event.action || '' }}
            > Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
