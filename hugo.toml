baseurl = "https://hugozhu.site"
DefaultContentLanguage = "en"
title = "All about Raspberry Pi"
# Using theme as git submodule
theme = "beautifulhugo"
# Or when using theme as hugo module
# theme = "github.com/halogenica/beautifulhugo"
pygmentsStyle = "trac"
pygmentsUseClasses = true
pygmentsCodeFences = true
pygmentsCodefencesGuessSyntax = true
#pygmentsUseClassic = true
#pygmentOptions = "linenos=inline"
disqusShortname = "hugozhu"
googleAnalytics = "G-4K97QD8XRD"
enableRobotsTXT = true

[services]
  [services.disqus]
    shortname = "hugozhu"

[outputs]
    home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.tableOfContents]
    endLevel = 3
    ordered = false
    startLevel = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[Params]
  homeTitle = "Hugo Zhu's Blog"
  tableOfContents = true
  subtitle = ""
  mainSections = ["post", "posts"]
  logo = "img/pi.png" # Expecting square dimensions
  favicon = "img/pi.ico"
  dateFormat = "January 2, 2006"
  commit = false
  rss = true
  comments = true
  readingTime = true
  wordCount = true
  useHLJS = true
  socialShare = true
  delayDisqus = true
  showRelatedPosts = true
  hideAuthor = true
  #gcse = "617d351a633194d48" # Get your code from google.com/cse. Make sure to go to "Look and Feel" and change Layout to "Full Width" and Theme to "Classic"

