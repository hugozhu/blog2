        demand_share: 0.05
        value: "high"
        ai_capability: 4
        routing: assisted
        checkpoints: ["需求澄清", "代码审查", "测试验证"]
        description: "根据需求生成可运行代码"
        intent_keywords: ["实现", "写一个", "开发", "构建", "创建", "功能"]
        examples:
          - "用Python写一个REST API服务"
          - "实现一个二叉树的遍历算法"

      - id: code.debugging
        name: "代码调试/Bug修复"
        demand_share: 0.04
        value: "high"
        ai_capability: 4
        routing: assisted
        checkpoints: ["Bug定位确认", "修复方案审查"]
        description: "定位并修复代码中的问题"
        intent_keywords: ["bug", "报错", "错误", "不工作", "修复", "为什么", "异常"]
        examples:
          - "这段代码报错了，帮我看看"
          - "为什么这个函数返回null？"

      - id: code.review
        name: "代码审查/重构建议"
        demand_share: 0.02
        value: "medium-high"
        ai_capability: 4
        routing: assisted
        checkpoints: ["审查重点确认", "重构方案评估"]
        description: "审查代码质量，提出改进建议"
        intent_keywords: ["review", "审查", "重构", "优化", "改进", "代码质量"]
        examples:
          - "帮我review这段代码"
          - "这段代码有什么可以优化的地方？"

      - id: code.automation
        name: "脚本自动化/运维任务"
        demand_share: 0.03
        value: "high"
        ai_capability: 4
        routing: assisted
        checkpoints: ["执行计划确认", "危险操作二次确认"]
        description: "自动化脚本、部署、运维操作"
        intent_keywords: ["自动化", "部署", "脚本", "cron", "运维", "CI/CD", "批量"]
        examples:
          - "写一个自动备份数据库的脚本"
          - "帮我配置Docker Compose部署"

      - id: code.documentation
