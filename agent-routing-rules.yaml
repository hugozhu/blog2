# ----------------------------------------------------------
# 路由决策矩阵（快速查找表）
# ----------------------------------------------------------
routing_matrix:
  # AI能力 × 任务价值 → 路由策略
  # 能力5 + 任意价值 → autonomous
  # 能力4 + 低/中价值 → autonomous
  # 能力4 + 高价值 → assisted
  # 能力3 + 任意价值 → collaborative
  # 能力≤2 → degraded
  rules:
    - condition: "ai_capability >= 5"
      strategy: autonomous
      reason: "AI可完美处理"
    - condition: "ai_capability == 4 AND value IN ['low', 'low-medium', 'medium']"
      strategy: autonomous
      reason: "AI可靠处理，风险低"
    - condition: "ai_capability == 4 AND value IN ['medium-high', 'high']"
      strategy: assisted
      reason: "AI可靠但价值高，需关键节点确认"
    - condition: "ai_capability == 3"
      strategy: collaborative
      reason: "AI能力有限，需人工深度参与"
    - condition: "ai_capability <= 2"
      strategy: degraded
      reason: "超出AI能力范围"

# ----------------------------------------------------------
# 意图分类Prompt模板
# ----------------------------------------------------------
classification_prompt: |
  你是一个通用AI Agent的意图分类器。根据用户输入，判断其任务类型。

  ## 分类规则
  请从以下8个大类中选择最匹配的一个，并进一步选择小类：

  1. 信息获取与研究 (research)
     - fact_query: 事实查询
     - deep_research: 深度研究/调研报告
     - comparison: 信息对比/竞品分析
     - monitoring: 实时信息监控/追踪
     - academic: 文献/论文检索与总结

  2. 内容创作 (content)
     - short_text: 短文本撰写
     - long_form: 长文写作
     - translation: 多语言翻译/本地化
     - creative: 创意写作
     - rewrite: 内容改写/润色/风格迁移

  3. 代码与开发 (code)
     - generation: 代码生成
     - debugging: 代码调试/Bug修复
     - review: 代码审查/重构建议
     - automation: 脚本自动化/运维任务
     - documentation: 技术文档/API文档生成

  4. 数据处理与分析 (data)
     - cleaning: 数据清洗/格式转换
     - analysis: 数据分析/统计计算
     - visualization: 数据可视化/图表生成
     - reporting: 报表生成/自动化报表
     - extraction: 数据提取

  5. 网页与自动化操作 (automation)
     - scraping: 网页信息抓取/采集
     - form: 表单填写/批量操作
     - workflow: 跨平台工作流编排
     - commerce: 电商/预订/采购操作
     - social: 社交媒体自动化

  6. 决策辅助与规划 (decision)
     - recommendation: 方案推荐/选型建议
     - planning: 行程/计划/排期规划
     - risk: 风险评估/可行性分析
     - brainstorm: 头脑风暴/创意发散

  7. 学习与教育 (learning)
     - qa: 知识问答/概念解释
     - path: 学习路径/课程规划
     - exercise: 练习生成/测验出题
     - tutoring: 作业辅导/解题指导

  8. 文件与办公处理 (office)
     - format: 文档格式转换/整理
     - presentation: PPT/演示文稿生成
     - meeting: 会议纪要/摘要生成
     - legal: 合同/法律文书起草

  ## 输出格式（JSON）
  {
    "category": "大类ID",
    "subcategory": "小类ID",
    "confidence": 0.0-1.0,
    "multi_label": ["如有多个意图，列出所有匹配的小类ID"],
    "needs_clarification": true/false,
    "clarification_questions": ["如需澄清，列出问题"]
  }

  ## 注意事项
  - 如果用户输入包含多个意图，在multi_label中列出所有匹配项，但category/subcategory填写最主要的
  - 如果用户意图模糊不清，设置needs_clarification为true，并提供澄清问题
  - confidence低于0.6时，建议向用户确认分类结果
