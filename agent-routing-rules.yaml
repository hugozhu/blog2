# ============================================================
# 通用 Agent 任务分类路由规则
# 用途：用户意图 → 两层分类 → 路由决策
# 版本：v1.0
# ============================================================

# ----------------------------------------------------------
# 路由决策策略定义
# ----------------------------------------------------------
routing_strategies:
  autonomous:
    label: "自主执行"
    description: "AI能力可独立完成，无需人工介入"
    human_in_loop: false
  assisted:
    label: "辅助执行"
    description: "AI可完成主体工作，关键节点需人工确认"
    human_in_loop: true
    checkpoints: ["输出确认", "关键参数校验"]
  collaborative:
    label: "协作执行"
    description: "AI提供框架/草稿/建议，人工主导完成"
    human_in_loop: true
    checkpoints: ["方案确认", "中间结果审查", "最终验收"]
  degraded:
    label: "降级处理"
    description: "超出当前AI能力，需拆分任务或引导用户"
    human_in_loop: true
    fallback: "任务拆分 / 引导用户提供更多信息 / 转人工"

# ----------------------------------------------------------
# 大类定义
# ----------------------------------------------------------
categories:

  # ==================== 1. 信息获取与研究 ====================
  - id: research
    name: "信息获取与研究"
    name_en: "Information Retrieval & Research"
    demand_share: 0.25
    description: "用户需要获取、整理、分析外部信息"
    intent_keywords:
      - ["查", "搜索", "找资料", "了解", "研究", "调研", "对比", "分析", "总结", "监控", "追踪"]
    subcategories:

      - id: research.fact_query
        name: "事实查询"
        demand_share: 0.08
        value: "low-medium"
        ai_capability: 5  # ★★★★★
        routing: autonomous
        description: "查询明确的事实、数据、定义"
        intent_keywords: ["是什么", "多少", "什么时候", "哪里", "谁", "定义", "价格", "天气"]
        examples:
          - "iPhone 16的电池容量是多少？"
          - "杭州今天天气怎么样？"
          - "GDP排名前十的国家"

      - id: research.deep_research
        name: "深度研究/调研报告"
        demand_share: 0.07
        value: "high"
        ai_capability: 4
        routing: assisted
        checkpoints: ["研究框架确认", "关键结论校验"]
        description: "需要多源信息整合、深度分析的研究报告"
        intent_keywords: ["调研报告", "深度分析", "行业研究", "趋势", "综述", "全面分析"]
        examples:
          - "帮我写一份AI Agent行业的调研报告"
          - "分析新能源汽车市场未来5年趋势"

      - id: research.comparison
        name: "信息对比/竞品分析"
        demand_share: 0.05
        value: "high"
        ai_capability: 4
        routing: assisted
        checkpoints: ["对比维度确认", "数据来源校验"]
        description: "两个或多个对象的对比分析"
        intent_keywords: ["对比", "比较", "vs", "哪个好", "区别", "竞品", "优劣"]
        examples:
          - "对比Claude和GPT-4的优劣势"
          - "Manus和Genspark有什么区别？"

      - id: research.monitoring
        name: "实时信息监控/追踪"
        demand_share: 0.03
        value: "medium-high"
        ai_capability: 3
        routing: assisted
        checkpoints: ["监控规则确认", "告警阈值设定"]
        description: "持续追踪某个主题/数据的变化"
        intent_keywords: ["监控", "追踪", "提醒", "订阅", "关注", "有变化告诉我"]
        examples:
          - "帮我监控这个竞品的价格变化"
          - "追踪某公司的最新融资动态"

      - id: research.academic
        name: "文献/论文检索与总结"
        demand_share: 0.02
        value: "high"
        ai_capability: 4
        routing: assisted
        checkpoints: ["检索策略确认", "关键论文筛选"]
        description: "学术论文搜索、阅读、总结"
        intent_keywords: ["论文", "文献", "arxiv", "学术", "研究进展", "综述"]
        examples:
          - "搜索最近关于RAG优化的论文"
          - "总结Transformer架构的演进"

  # ==================== 2. 内容创作 ====================
