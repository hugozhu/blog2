    name_en: "Content Creation"
    demand_share: 0.22
    description: "用户需要生成、修改、翻译文本内容"
    intent_keywords:
      - ["写", "创作", "生成", "翻译", "润色", "改写", "文案", "文章", "邮件"]
    subcategories:

      - id: content.short_text
        name: "短文本撰写"
        demand_share: 0.07
        value: "low-medium"
        ai_capability: 5
        routing: autonomous
        description: "邮件、消息、短文案等"
        intent_keywords: ["写邮件", "发消息", "文案", "通知", "公告", "回复"]
        examples:
          - "帮我写一封会议邀请邮件"
          - "写一条产品发布的社交媒体文案"

      - id: content.long_form
        name: "长文写作"
        demand_share: 0.05
        value: "high"
        ai_capability: 4
        routing: assisted
        checkpoints: ["大纲确认", "初稿审查", "终稿验收"]
        description: "博客、报告、方案等长文本"
        intent_keywords: ["博客", "报告", "方案", "文章", "白皮书", "策划"]
        examples:
          - "写一篇关于Agent架构的技术博客"
          - "写一份产品需求文档"

      - id: content.translation
        name: "多语言翻译/本地化"
        demand_share: 0.04
        value: "medium"
        ai_capability: 5
        routing: autonomous
        description: "跨语言翻译，含本地化适配"
        intent_keywords: ["翻译", "translate", "中译英", "英译中", "本地化"]
        examples:
          - "把这段中文翻译成英文"
          - "将这个产品说明本地化为日文版本"

      - id: content.creative
        name: "创意写作"
        demand_share: 0.02
        value: "medium"
        ai_capability: 3
        routing: collaborative
        checkpoints: ["创意方向确认", "草稿审查", "风格调整"]
        description: "故事、剧本、诗歌等创意内容"
        intent_keywords: ["故事", "剧本", "诗歌", "小说", "创意", "slogan"]
        examples:
          - "写一个关于AI的短篇科幻故事"
          - "为我们的品牌想几个slogan"

      - id: content.rewrite
        name: "内容改写/润色/风格迁移"
        demand_share: 0.04
        value: "medium"
        ai_capability: 5
        routing: autonomous
        description: "修改已有内容的风格、语气、长度"
        intent_keywords: ["润色", "改写", "精简", "扩写", "换个说法", "风格"]
        examples:
          - "把这段文字改得更正式一些"
          - "精简这份报告到500字以内"

  # ==================== 3. 代码与开发 ====================
